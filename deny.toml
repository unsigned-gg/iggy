# cargo-deny configuration (estate fork, see ESTATE.md).
# Run: cargo deny check
#
# The license allow list copies about.toml, so cargo-deny and the
# cargo-about release check accept the same licenses. The advisory,
# source and ban checks are new: the repo had no RustSec check before.

[graph]
all-features = false

[advisories]
# Any RustSec vulnerability, unsound or unmaintained advisory against a
# crate in Cargo.lock fails the check. An ignore needs the advisory id
# and a reason, for example:
# { id = "RUSTSEC-0000-0000", reason = "not reachable: ..." }
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-3-Clause-Clear",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    "NCSA",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = [
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
