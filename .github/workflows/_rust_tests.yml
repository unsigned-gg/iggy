name: _rust_tests
on:
  workflow_call:
    inputs:
      timeout-minutes:
        type: number
        default: 60
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  tests:
    name: test (${{ matrix.partition }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download test artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rust-test-build-${{ github.run_id }}
          path: ${{ runner.temp }}/rust-test-build

      - name: Run test shard
        uses: ./.github/actions/rust/pre-merge
        with:
          task: test
          partition: ${{ matrix.partition }}
          partitions: ${{ strategy.job-total }}

      - name: Generate coverage report
        if: always() && !cancelled()
        # Coverage must not block the PR: llvm-profdata rejects the whole
        # merge when a single .profraw file is truncated.
        continue-on-error: true
        run: |
          if compgen -G 'target/*.profraw' > /dev/null; then
            cargo llvm-cov report --codecov --output-path codecov.json
          else
            echo "::notice::No coverage profiles found; skipping report"
          fi
        shell: bash

      - name: Upload coverage to Codecov
        if: always() && !cancelled() && hashFiles('codecov.json') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          disable_search: true
          flags: rust
          fail_ci_if_error: false
          verbose: true
          override_pr: ${{ github.event.pull_request.number }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-test-${{ matrix.partition }}-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/**
            target/llvm-cov/**
            coverage.lcov
            codecov.json
          if-no-files-found: ignore
          retention-days: 7
