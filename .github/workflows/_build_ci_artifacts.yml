name: _build_ci_artifacts
on:
  workflow_call:
    inputs:
      task:
        description: "Artifact producer: runtime or test-build"
        type: string
        required: true
      test-scope:
        type: string
        default: affected
      save-cache:
        type: boolean
        default: false
      build-metadata:
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 120

permissions:
  contents: read

env:
  IGGY_CI_BUILD: ${{ inputs.build-metadata }}

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare artifacts
        uses: ./.github/actions/rust/pre-merge
        with:
          task: ${{ inputs.task }}
          test-scope: ${{ inputs.test-scope }}
          save-cache: ${{ inputs.save-cache }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-${{ inputs.task }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rust-${{ inputs.task }}/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 30
