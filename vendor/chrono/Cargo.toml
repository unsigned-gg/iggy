[package]
edition = "2021"
rust-version = "1.83.0"
name = "chrono"
version = "0.4.45"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Date and time library for Rust (hardened safe jiff-backed compatibility crate)"
homepage = "https://github.com/chronotope/chrono"
documentation = "https://docs.rs/chrono/"
readme = "README.md"
keywords = [
    "date",
    "time",
    "calendar",
]
categories = ["date-and-time"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/chronotope/chrono"
publish = false

[features]
__internal_bench = []
alloc = []
clock = [
    "now",
    "dep:jiff",
]
core-error = []
default = [
    "clock",
    "std",
    "oldtime",
    "wasmbind",
]
defmt = [
    "dep:defmt",
    "pure-rust-locales?/defmt",
]
libc = []
now = ["std"]
oldtime = []
rkyv = [
    "dep:rkyv",
    "rkyv/size_32",
]
rkyv-16 = [
    "dep:rkyv",
    "rkyv?/size_16",
]
rkyv-32 = [
    "dep:rkyv",
    "rkyv?/size_32",
]
rkyv-64 = [
    "dep:rkyv",
    "rkyv?/size_64",
]
rkyv-validation = ["rkyv?/validation"]
std = ["alloc"]
unstable-locales = ["pure-rust-locales"]
wasmbind = [
    "wasm-bindgen",
    "js-sys",
]
winapi = []

[lib]
name = "chrono"
path = "src/lib.rs"

[dependencies.arbitrary]
version = "1.0.0"
features = ["derive"]
optional = true

[dependencies.defmt]
version = "1.0.1"
optional = true

[dependencies.jiff]
version = "0.2"
default-features = false
features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"]
optional = true

[dependencies.num-traits]
version = "0.2"
default-features = false

[dependencies.pure-rust-locales]
version = "0.8.2"
optional = true

[dependencies.rkyv]
version = "0.7.43"
optional = true
default-features = false

[dependencies.serde]
version = "1.0.99"
optional = true
default-features = false

[target.'cfg(all(target_arch = "wasm32", not(any(target_os = "emscripten", target_os = "wasi"))))'.dependencies.js-sys]
version = "0.3"
optional = true

[target.'cfg(all(target_arch = "wasm32", not(any(target_os = "emscripten", target_os = "wasi"))))'.dependencies.wasm-bindgen]
version = "0.2"
optional = true
